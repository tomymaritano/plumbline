<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plumbline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  {{RAIL}}
  <main>
    <p class="crumb"><a href="./">Plumbline</a></p>
    <article id="doc"><p>Loading…</p></article>
    <footer>
      <p>Inspired by John Ousterhout's <a href="https://web.stanford.edu/~ouster/cgi-bin/aposd.php"><em>A Philosophy of Software Design</em></a>. Not affiliated with or endorsed by the author or his publishers.</p>
      <p><a href="{{REPO}}">GitHub</a> · MIT License</p>
    </footer>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script type="module">
  const file = new URLSearchParams(location.search).get("file") || "";
  const doc = document.getElementById("doc");

  async function render() {
    if (!/^[a-z0-9-]+$/.test(file)) {
      doc.textContent = "Unknown page.";
      return;
    }
    const res = await fetch(`docs/${file}.md`);
    if (!res.ok) throw new Error(String(res.status));
    const md = await res.text();
    const title = (md.match(/^# (.+)$/m) || [])[1] || file;
    document.title = `${title} · Plumbline`;
    doc.innerHTML = marked.parse(md, { mangle: false, headerIds: false });
    for (const a of doc.querySelectorAll("a[href]")) {
      const h = a.getAttribute("href");
      if (/^https?:/.test(h) || h.startsWith("#") || h.startsWith("/")) continue;
      if (/^[a-z0-9-]+\.md$/.test(h)) a.href = `doc.html?file=${h.replace(/\.md$/, "")}`;
      else a.href = `docs/${h}`;
    }
  }

  try {
    await render();
  } catch {
    doc.textContent = "Couldn't load this page.";
  }
</script>
</body>
</html>

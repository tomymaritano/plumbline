<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plumbline skill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  {{RAIL}}
  <main>
    <p class="crumb"><a href="./">Plumbline</a><span id="crumb-here"></span></p>
    <article id="doc"><p>Loading…</p></article>
    <footer>
      <p>Inspired by John Ousterhout's <a href="https://web.stanford.edu/~ouster/cgi-bin/aposd.php"><em>A Philosophy of Software Design</em></a>. Not affiliated with or endorsed by the author or his publishers.</p>
      <p><a href="{{REPO}}">GitHub</a> · MIT License</p>
    </footer>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script type="module">
  // Renders skills/<name>/SKILL.md, the same file the plugin ships.
  const params = new URLSearchParams(location.search);
  const name = params.get("name") || "";
  const file = params.get("file") || "SKILL.md";
  const doc = document.getElementById("doc");

  async function render() {
    if (!/^[a-z-]+$/.test(name) || !/^(SKILL\.md|references\/[a-z0-9-]+\.md)$/.test(file)) {
      doc.textContent = "Unknown skill.";
      return;
    }
    const res = await fetch(`skills/${name}/${file}`);
    if (!res.ok) throw new Error(String(res.status));
    const md = await res.text();
    const m = md.match(/^---\n([\s\S]*?)\n---\n/);
    const body = m ? md.slice(m[0].length) : md;
    const desc = m && (m[1].match(/^description:\s*"(.*)"$/m) || [])[1];
    const here = file === "SKILL.md" ? "" : file.replace("references/", "").replace(/\.md$/, "");
    document.title = `${here ? here + " · " : ""}${name} · Plumbline`;
    if (file !== "SKILL.md") {
      const crumb = document.getElementById("crumb-here");
      crumb.textContent = "";
      crumb.append(" / ");
      const back = document.createElement("a");
      back.href = `skill.html?name=${name}`;
      back.textContent = name;
      crumb.append(back);
    }
    const html = marked.parse(body.replaceAll("$ARGUMENTS", "the target you give it"), { mangle: false, headerIds: false });
    doc.innerHTML = (desc ? `<p class="label">When it runs</p><p class="when"></p>` : "") + html;
    if (desc) doc.querySelector(".when").textContent = desc.replaceAll('\\"', '"');
    for (const a of doc.querySelectorAll("a[href]")) {
      const raw = a.getAttribute("href");
      const hash = raw.includes("#") ? raw.slice(raw.indexOf("#")) : "";
      const h = raw.split("#")[0];
      let target = null;
      if (/^references\/[a-z0-9-]+\.md$/.test(h)) target = h;
      else if (file.startsWith("references/") && /^[a-z0-9-]+\.md$/.test(h)) target = `references/${h}`;
      else if (h === "SKILL.md" || h === "../SKILL.md") target = "SKILL.md";
      if (target) a.href = `skill.html?name=${name}&file=${target}${hash}`;
      else if (h && !/^(https?:|#|\/)/.test(h)) a.href = `skills/${name}/${file.startsWith("references/") ? "references/" : ""}${h}`;
    }
  }

  try {
    await render();
  } catch {
    doc.textContent = "Couldn't load this skill.";
  }
</script>
</body>
</html>
